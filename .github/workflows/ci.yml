name: CI

on:
  pull_request: {}
  push:
    branches: [master]
  workflow_dispatch: {}

# contents: write is required for the peaceiris/actions-gh-pages@v4 step
# that pushes storybook-static/ to the `storybook` branch.
# id-token: write is required for npm Trusted Publishing (OIDC). The
# runner exchanges an OIDC token via actions/setup-node@v4's automatic
# exchange; the publish step authenticates with that token instead of
# any NPM_TOKEN secret. See AGENTS.md 2026-10-19 dated entries for the
# migration path.
permissions:
  contents: write
  id-token: write

# Cancel superseded PR runs (cheap lint/format/test can restart).
# Master pushes are NEVER cancelled; a half-finished `npm publish`
# cannot be safely rolled back at the registry.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: lint → format → test → publish → storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # GitHub Deployment environment; declared once here so any rules,
    # required reviewers, or environment-scoped secrets configured in
    # Settings -> Environments -> `production` apply to the master push
    # automatically. One-time admin step by the project admin.
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      # Node 24 LTS. npm Trusted Publishing requires npm >= 11.5.1 and
      # Node >= 22.14; Node 24 ships npm 11+ bundled, so no separate
      # `npm install -g npm@latest` step is needed. setup-node@v4
      # auto-detects `ACTIONS_ID_TOKEN_REQUEST_TOKEN` (granted by the
      # `id-token: write` permission above) and exchanges it for an
      # npm auth token at publish time, so no NODE_AUTH_TOKEN env and
      # no registry-url input are required.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Pipeline mandates: lint -> format -> test (all branches)
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Test
        run: npm run test

      # Master-only tail: publish + storybook deploy
      - name: Publish to npm
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npm publish --access public
        # prepublishOnly runs sync-readme first, then lint, test, build.

      - name: Build Storybook
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npm run build:storybook

      - name: Publish Storybook to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          publish_branch: storybook
          keep_history: true
          user_name: github-actions[bot]
          user_email: github-actions[bot@users.noreply.github.com]
